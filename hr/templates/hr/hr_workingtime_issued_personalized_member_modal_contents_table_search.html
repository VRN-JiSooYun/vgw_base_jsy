{% load crispy_forms_tags %}
{% load bootstrap %}
{% load static %}




	<table class="table">
		<tr>
			<th width="20%">
				이름/팀명으로 검색
			</th>
			<td widht="30%">
				<input type="text" v-model="inputTextName" @input="f_personalizedSearch" class="form-control">
			</td>
		</tr>

		<tr>
			<td colspan="2" width="50%">

				<table class="table">
					<tr style="background-color:rgba(255, 255, 255, 0.85)"
					v-for="dict_personalized_searched in list_dict_personalized_searched" :key="dict_personalized_searched"
					>
						<td>
							[[ dict_personalized_searched.name ]]
							<button type="button" class="btn btn-link btn-sm" @click="f_personalizedSelect(dict_personalized_searched.hrlayout_id)" >
								<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle-fill" viewBox="0 0 16 16">
									<path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3v-3z"/>
								</svg>
							</button>
							<br>
							[[ dict_personalized_searched.position ]]
						</td>
					</tr>
				</table>

			</td>
		</tr>
	</table>
