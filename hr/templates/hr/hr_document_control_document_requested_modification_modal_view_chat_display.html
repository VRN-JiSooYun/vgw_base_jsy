{% load crispy_forms_tags %}
{% load bootstrap %}
{% load static %}



<h5 class="modal-title" id="exampleModalLabel">
	<strong>
		수정요청내용 대화하기
	</strong>
</h5>

<table class="table">
	<tr style="background-color:rgb(240,240,240,0.5);">
		<th colspan="3">
			대화 내용
		</th>

	</tr>
	<tr style="background-color:rgb(240,240,240,0.5);">
		<td width="60%" rowspan="2" style="background-color:rgb(255,255,255,0.85)">
			<ul>
				<li v-for="(dict_item, index) in list_dict_request_talk_for_document_management" :key="index">
					[[ dict_item.name ]]([[ dict_item.id ]]) : [[ dict_item.talk ]]
					<template v-if="dict_item.id == list_dict_request_talk_for_document_management.length">
						<template v-if="dict_item.name == my_name_korean">
							<button type="button" @click="f_buttonTalkDelete(dict_item.id)" class="btn btn-link btn-sm">
								<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
									<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
									<path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
								</svg>
							</button>
						</template>
					</template>
				</li>
			</ul>
		</td>
		<td width="30%">
			<div class="form-group">
			<label for="my-workingtime-control-form-workingtime-plan-reason">내용 입력 [[ inputTextReason ]]</label>
			<input type="text" class="form-control" placeholder="내용을 입력하세요." :value="inputTextReason" v-on:input="f_inputTextReason">
			</div>
		</td>
		<td width="10%">
			<br><br>
			<button type="button" @click="f_buttonTalkRegister" class="btn btn-info btn-sm">
				Talk
			</button>
		</td>
	</tr>
	<tr style="background-color:rgb(240,240,240,0.5);">
		<td width="30%">
			<div class="mb-3">
				<label for="formFile" class="form-label">첨부파일(선택)</label>
				<input class="form-control" type="file" id="formFile" @change="f_inputFileUpload"  />
				<span v-if="file_name !='' "> 등록된 파일명 : [[ file_name ]]</span>
			</div>
		</td>
		<td width="10%">
			<br><br>
			<button type="button" @click="f_buttonFileUpload" class="btn btn-info btn-sm">
				Save
			</button>
		</td>
	</tr>
	<tr v-if="img_src != '' ">
		<td></td>
		<td class="text-right">
			<img v-if="img_src" :src="img_src" width="128" height="128">
		</td>
	</tr>
</table>
