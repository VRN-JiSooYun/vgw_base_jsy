{% load crispy_forms_tags %}
{% load bootstrap %}
{% load static %}



<div class="card card-body" style="background-color:rgb(255,255,255,0.5)">
	<table class="table">
		<tr
		v-for="(dict_takeover, index) in list_dict_document_takeover" :key="dict_takeover"
		>
			<th>
				순번
			</th>
			<td>
				[[ index + 1 ]]
			</td>
			<th>
				이름
			</th>
			<td>
				[[ dict_takeover.name ]]
			</td>
			<th>
				포지션
			</th>
			<td>
				[[ dict_takeover.position ]]
			</td>
			<td class="text-right"
			v-if="status_dam_modal_view_search_member == 'TAKEOVER'"
			>
				<button type="button" class="btn" @click="f_takeoverDelete(dict_takeover.hrlayout_id)">
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">

					  </svg>

		</tr>
	</table>
</div>
