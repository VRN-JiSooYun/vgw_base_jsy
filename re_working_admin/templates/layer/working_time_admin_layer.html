<div id="working_time_admin_modal" class="modal fade" data-backdrop="static" data-keyboard="true" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" v-html="title"></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7;">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">이름</div>
                    <div class="col" style="padding: 15px;" v-html="memberName"></div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">부서</div>
                    <div class="col" style="padding: 15px;" v-html="groupName"></div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">출근 시간</div>
                    <div class="col-4" style="padding: 15px;" v-html="time(oriWorkingStartCheckTime)"></div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">퇴근 시간</div>
                    <div class="col-4" style="padding: 15px;" v-html="time(oriWorkingEndCheckTime)"></div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">출근 시간</div>
                    <div class="col-4" style="padding: 15px;">
                        <input  type="time" class="form-control" v-model="workingStartCheckTime">
                    </div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">퇴근 시간</div>
                    <div class="col-4" style="padding: 15px;">
                        <input  type="time" class="form-control" v-model="workingEndCheckTime">
                    </div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">외부근무</div>
                    <div class="col" style="padding: 15px;">
                        <select class="form-control" aria-label=".form-select-sm" style="width: 200px" v-model="workingOutFormType">
                            <option value="">--선택하세요--</option>
                            <option v-for="codeDtl in codeDtls" :value="codeDtl.cd_dtl_no" v-html="codeDtl.cd_dtl_nm"></option>
                        </select>
                    </div>
                </div>
                <div id="layer_alert" class="toast toast-danger" role="layer_alert" aria-live="assertive" data-delay="1500" aria-atomic="true" style="position:absolute; left:25%; background-color:#f8d7da; z-index:999">
                    <div class="toast-body" v-html="alertText"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="close">취소</button>
                <button type="button" class="btn btn-primary" @click="save">저장</button>
            </div>
        </div>
    </div>
</div>

<script>
    const working_time_admin_vue = createApp({
        data () {
            return {
                title: "",
                working: {},
                memberName: "",
                groupName: "",
                oriWorkingStartCheckTime: "",
                oriWorkingEndCheckTime: "",
                workingStartCheckTime: "00:00",
                workingEndCheckTime: "00:00",
                workingOutFormType: "",
                alertText: "",
            }
        },
        computed: {
            codeDtls() {
                return code_vue.getCdDtlsByCdAlias("WORKING_OUT_TYPE")
            }
        },
        methods: {
            time(datetime) {
                if (datetime == '' || datetime == null) return "누락"
                return moment(datetime).format("HH:mm")
            },
            checkTime(datetime) {
                if (datetime == '' || datetime == null) return ""
                return moment(datetime).format("HH:mm")
            },
            getWorking(working) {
                this.title = "출퇴근 변경 (" + working.working_date + ")"
                this.working = working
                this.memberName = working.member_name
                this.groupName = working.group_name
                this.oriWorkingStartCheckTime = working.working_start_check_datetime
                this.oriWorkingEndCheckTime = working.working_end_check_datetime
                this.workingStartCheckTime = this.checkTime(working.working_start_check_datetime)
                this.workingEndCheckTime = this.checkTime(working.working_end_check_datetime)

                if (this.working.working_out_type != null) {
                    this.workingOutFormType = this.working.working_out_type
                }

            },
            save() {
                if (this.oriWorkingStartCheckTime == null && this.oriWorkingEndCheckTime == null) {
                    if (this.workingStartCheckTime == '' && this.workingEndCheckTime == '') {
                        this.alert("변경할 출퇴근 시간을 입력해 주세요")
                        return
                    }
                }

                var workingStartCheckDatetime = ""
                if (this.workingStartCheckTime != "") {
                    workingStartCheckDatetime = this.working.working_date + " " + this.workingStartCheckTime
                }

                var workingEndCheckDatetime = ""
                if (this.workingEndCheckTime != "") {
                    workingEndCheckDatetime = this.working.working_date + " " + this.workingEndCheckTime
                }

                var data = {
                    member_id: this.working.member_id,
                    working_id: this.working.working_id,
                    working_date: this.working.working_date,
                    working_start_check_datetime: workingStartCheckDatetime,
                    working_end_check_datetime: workingEndCheckDatetime,
                }
                axios.post("/re-working-admin/updateWorkingTime", {data: data})
                .then((response) => {
                    vue.getWorkings()
                    $("#working_time_admin_modal").modal('hide')
                })


                if (this.workingOutFormType !== "") {
                    var data = {
                        working_out_form_type: this.workingOutFormType,
                        working_out_form_start_date: workingStartCheckTime,
                        working_out_form_end_date: workingEndCheckDatetime,
                        member_id: this.working.member_id,
                    }

                    axios.post("/re-working/createWorkingOut", {data: data})
                }
            },
            close() {
                $("#working_time_admin_modal").modal('hide')
                this.working = ""
                this.memberName = ""
                this.groupName = ""
                this.oriWorkingStartCheckTime = ""
                this.oriWorkingEndCheckTime = ""
                this.workingStartCheckTime = "00:00"
                this.workingEndCheckTime = "00:00"
                this.workingOutFormType = ""
            },
            alert(text) {
                this.alertText = text
                $('#layer_alert').toast('show')
            }
        },
        mounted: function() {
            var self = this
            $('#working_time_admin_modal').on('hidden.bs.modal', function (e) {
                self.close()
            })
        },
    }).mount('#working_time_admin_modal')
</script>
