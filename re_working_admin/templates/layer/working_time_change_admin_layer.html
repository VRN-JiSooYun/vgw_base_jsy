<div id="working_time_change_admin_modal" class="modal fade" data-backdrop="static" data-keyboard="true" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">출퇴근시간 변경</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7;">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">이름</div>
                    <div class="col" style="padding: 15px;" v-html="workingTime.member_name"></div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">부서</div>
                    <div class="col" style="padding: 15px;" v-html="workingTime.group_name"></div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9; text-align: center">월</div>
                    <div class="col-8" style="display: flex; padding: 15px;">
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_start_time_1">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_end_time_1">
                    </div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9; text-align: center">화</div>
                    <div class="col-8" style="display: flex; padding: 15px;">
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_start_time_2">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_end_time_2">
                    </div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9; text-align: center">수</div>
                    <div class="col-8" style="display: flex; padding: 15px;">
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_start_time_3">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_end_time_3">
                    </div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9; text-align: center">목</div>
                    <div class="col-8" style="display: flex; padding: 15px;">
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_start_time_4">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_end_time_4">
                    </div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9; text-align: center">금</div>
                    <div class="col-8" style="display: flex; padding: 15px;">
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_start_time_5">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="time" class="form-control" style="width: 140px" v-model="workingTime.working_time_end_time_5">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="close">취소</button>
                <button type="button" class="btn btn-primary" @click="save">저장</button>
            </div>
        </div>
    </div>
</div>

<script>
    const working_time_change_admin_vue = createApp({
        data () {
            return {
                workingTime: {},
            }
        },
        methods: {
            getWorkingTime(workingTime) {
                this.workingTime = workingTime
            },
            save() {
                var data = {
                    working_time_id: this.workingTime.working_time_id,
                    working_time_start_time_1: this.workingTime.working_time_start_time_1,
                    working_time_end_time_1: this.workingTime.working_time_end_time_1,
                    working_time_start_time_2: this.workingTime.working_time_start_time_2,
                    working_time_end_time_2: this.workingTime.working_time_end_time_2,
                    working_time_start_time_3: this.workingTime.working_time_start_time_3,
                    working_time_end_time_3: this.workingTime.working_time_end_time_3,
                    working_time_start_time_4: this.workingTime.working_time_start_time_4,
                    working_time_end_time_4: this.workingTime.working_time_end_time_4,
                    working_time_start_time_5: this.workingTime.working_time_start_time_5,
                    working_time_end_time_5: this.workingTime.working_time_end_time_5,
                }

                axios.post("/re-working-admin/updateWorkingTimeChange", {data: data})
                .then((response) => {
                    vue.getWorkingTimes()
                    $("#working_time_change_admin_modal").modal('hide')
                })
            },
            close() {
                $("#working_time_change_admin_modal").modal('hide')
            },
        },
        mounted: function() {
            var self = this
            $('#working_time_change_admin_modal').on('hidden.bs.modal', function (e) {
                self.close()
            })
        },
    }).mount('#working_time_change_admin_modal')
</script>
