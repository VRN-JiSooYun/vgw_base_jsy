<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<div id="working_off_history_admin_modal" class="modal fade" data-backdrop="static" data-keyboard="true" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">휴가이력</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" @click="close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7;">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">이름</div>
                    <div class="col" style="padding: 15px;" v-html="member.member_name"></div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">부서</div>
                    <div class="col" style="padding: 15px;" v-html="member.group_name"></div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7;">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">휴가 기간</div>
                    <div class="col-3" style="padding: 15px;">
                        <input type="date" class="form-control" v-model="searchStartDate">
                    </div>
                    <div style="display:flex; margin-top:25px;">
                        <span class="material-symbols-outlined">more_vert</span>
                    </div>
                    <div class="col-3" style="padding: 15px;">
                        <input type="date" class="form-control" v-model="searchEndDate">
                    </div>
                    <div class="col-3" style="margin-top:20px;">
                        <button type="button" class="btn btn-info btn-sm" @click="getWorkingOffHistorys(member.member_id, '')">검색</button>
                    </div>
                </div>
                <div class="row" style="padding: 10px 0px 10px 0px;">
                    <div class="col">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">휴가종류</th>
                                    <th scope="col">기간</th>
                                    <th scope="col">사용일수</th>
                                    <th scope="col">승인일</th>
                                    <th scope="col">기능</th>
                                </tr>
                            </thead>
                            <tbody v-if="workingOffHistorys.length > 0">
                                <tr v-for="(item, index) in workingOffHistorys">
                                    <td v-html="num(index)"></td>
                                    <td v-html="cdDtlNm(item.working_off_form_type)"></td>
                                    <td v-html="date(item.working_off_form_start_date, item.working_off_form_end_date)"></td>
                                    <td v-html="item.working_off_form_use_num"></td>
                                    <td v-html="datetime(item)"></td>
                                    <td>
                                        <button v-if="isApprovalDone(item.working_off_form_state)" type="button" class="btn btn-sm btn-danger" @click="cancel(item.working_off_form_id)">휴가취소</button>
                                        <button v-else-if="isApprovalCancelAdmin(item.working_off_form_state)" type="button" class="btn btn-sm btn-secondary" @click="prevCancel(item.working_off_form_id)">이전으로</button>
                                        <span v-else v-html="cdDtlNm(item.working_off_form_state)"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="3">합계</td>
                                    <td v-html="totalUseNum"></td>
                                    <td colspan="2"></td>
                                </tr>
                            </tbody>
                            <tbody v-else>
                                <tr style="text-align:center">
                                    <td colspan="6">휴가 이력이 없습니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="close">취소</button>
                <button type="button" class="btn btn-primary" @click="download">다운로드</button>
            </div>
        </div>
    </div>
</div>

<script>
    const working_off_history_admin_vue = createApp({
        data () {
            return {
                member: {},
                searchStartDate: "",
                searchEndDate: "",
                workingOffHistorys: [],
                totalUseNum: 0,
            }
        },
        methods: {
            getMember(memberId) {
                axios.get("/re-member/getMember/" + memberId)
                .then((response) => {
                    this.member = response.data
                    this.searchStartDate = this.member.working_off_start_date
                    this.getWorkingOffHistorys(this.member.member_id)
                })
            },
            getWorkingOffHistorys(memberId) {
                this.workingOffHistorys = []
                this.totalUseNum = 0
                axios.get("/re-working-admin/getWorkingOffHistorys?member_id=" + memberId + "&start_date=" + this.searchStartDate + "&end_date=" + this.searchEndDate)
                .then((response) => {
                    this.workingOffHistorys = response.data

                    var totalUseNum = 0
                    for (workingOffHistory of this.workingOffHistorys) {
                        if (workingOffHistory.working_off_form_state != code_vue.getCdDtlNoByAlias('APPROVAL_CANCEL_ADMIN')) {
                            totalUseNum += workingOffHistory.working_off_form_use_num
                        }
                    }
                    this.totalUseNum = totalUseNum
                })
            },
            num(index) {
                return index + 1
            },
            date(startDate, endDate) {
                return startDate + " ~ " + endDate
            },
            datetime(item) {
                if (item.approval_date != null) {
                    return moment(item.approval_date).format('YYYY-MM-DD  HH:mm:ss')
                }

                return moment(item.date_updated).format('YYYY-MM-DD  HH:mm:ss')

            },
            cdDtlNm(cdDtlNo) {
                return code_vue.getCodeDtl(cdDtlNo).cd_dtl_nm
            },
            isApprovalDone(workingOffFormState) {
                if (workingOffFormState == code_vue.getCdDtlNoByAlias('APPROVAL_DONE')) {
                    return true
                }
                return false
            },
            isApprovalCancelAdmin(workingOffFormState) {
                if (workingOffFormState == code_vue.getCdDtlNoByAlias('APPROVAL_CANCEL_ADMIN')) {
                    return true
                }
                return false
            },
            cancel(workingOffFormId) {
                axios.post("/re-working-admin/updateWorkingOffCancel/" + workingOffFormId)
                .then((response) => {
                    this.getWorkingOffHistorys(this.member.member_id)
                    vue.getMembers()
                })
            },
            prevCancel(workingOffFormId) {
                axios.post("/re-working-admin/updatePrevWorkingOffCancel/" + workingOffFormId)
                .then((response) => {
                    this.getWorkingOffHistorys(this.member.member_id)
                    vue.getMembers()
                })
            },
            download() {
                var data = [
                    [ "휴가종료", "기간", "사용일수", "승인일" ]
                ]

                for (item of this.workingOffHistorys) {
                    data.push(
                        [
                            this.cdDtlNm(item.working_off_form_type)
                            ,this.date(item.working_off_form_start_date, item.working_off_form_end_date)
                            ,item.working_off_form_use_num
                            ,this.datetime(item.date_updated)
                        ]
                    )
                }

                var ws = XLSX.utils.aoa_to_sheet(data)
                var wb = XLSX.utils.book_new()

                XLSX.utils.book_append_sheet(wb, ws, "Sheet1")
                XLSX.writeFile(wb, '휴가이력_' + this.member.member_name + "_" + this.searchStartDate + "_" + this.searchEndDate + '.xlsx')
            },
            close() {
                $("#working_off_history_admin_modal").modal('hide')
                this.workingOffHistorys = []
                this.searchStartDate = ""
                this.searchEndDate = ""
            }
        },
        mounted: function() {
            var self = this
            $('#working_off_history_admin_modal').on('hidden.bs.modal', function (e) {
                self.close()
            })
        },
    }).mount('#working_off_history_admin_modal')
</script>
