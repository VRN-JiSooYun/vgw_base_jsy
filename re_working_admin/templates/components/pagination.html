<template id="pagination_template">
    <div>
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" :class="{ disabled: currentpage === 1 }">
                    <a class="page-link" href="#" @click.prevent="changePage(currentpage - 1)">Previous</a>
                  </li>
                  <li class="page-item" :class="{ active: page === currentpage }" v-for="page in pages" :key="page">
                    <a class="page-link" href="#" @click.prevent="changePage(page)">[[ page + offset ]]</a>
                  </li>
                  <li class="page-item" :class="{ disabled: currentpage === totalPages }">
                    <a class="page-link" href="#" @click.prevent="changePage(currentpage + 1)">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</template>

<script>
    const paginationComponent = {
        delimiters: ["[[", "]]"],
        props: {
            totalitems: {
              type: Number,
              required: true
            },
            itemsperpage: {
              type: Number,
              required: true,
              default: 10
            },
            currentpage: {
              type: Number,
              required: true,
              default: 1
            }
        },
        data () {
            return {
                pagePerPages: 10,
                offset: 0,
            }
        },
        computed: {
            pages() {
                let start = (Math.ceil(this.currentpage / this.pagePerPages) - 1) * this.pagePerPages + 1
                let end = Math.ceil(this.currentpage / this.pagePerPages) * this.pagePerPages

                if (this.totalPages <= end) end = this.totalPages
                return Array.from({ length: end - start + 1 }, (v, i) => i + start);
            },
            totalPages() {
                return Math.ceil(this.totalitems / this.itemsperpage)
            }
        },
        methods: {
            changePage(page) {
                if (page < 1 || page > this.totalPages) return;

                this.$emit('update:currentpage', page);
            }
        },
        mounted: function() {},
        template:'#pagination_template',
    }
</script>
