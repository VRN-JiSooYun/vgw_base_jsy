{% extends 'base.html' %}
{% load static %}
{% block content %}
{% include 'home/navbar/re_navbar.html' %}


<div id="working_time_change_admin" class="row" style="background-color: #f9f9f9;">
    <div class="col-md-2">
        <div class="form-group form-row" style="padding-left:10px; padding-right: 10px;position: relative;">
            <div class="form-group col-md-12 treeDiv" style="height:76.6vh; width: 100px; overflow-y: scroll; border: lightgray 1px solid; border-radius: 4px; margin-top:30px; margin-left:10px; margin-right:10px; background-color: #ffffff; "></div>
            <div style="width: 20px; height: 76.3vh; background-color: #ffffff; position: absolute; bottom: 18px; right: 2px"></div>
        </div>
    </div>
    <div class="col-md-16" style="position: relative;">
        <div style="flex: auto; margin-top:20px; margin-left: 20px; width: 80vw; height: 200px; padding: 1%; border-radius:25px; background-color: #ffffff;">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">월</th>
                        <th scope="col">화</th>
                        <th scope="col">수</th>
                        <th scope="col">목</th>
                        <th scope="col">금</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div style="display: flex; justify-content:center">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeStartTime1">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeEndTime1">
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; justify-content:center">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeStartTime2">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeEndTime2">
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; justify-content:center">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeStartTime3">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeEndTime3">
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; justify-content:center">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeStartTime4">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeEndTime4">
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; justify-content:center">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeStartTime5">
                                <input type="time" class="form-control" style="width: 7.2vw" v-model="workingTimeEndTime5">
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div style="text-align:end">
                <button type="button" class="btn btn-outline-success" @click="save">저장</button>
            </div>
        </div>
        <div style="flex: auto; margin-top:20px; margin-left: 20px; width: 80vw; height: 58vh; padding: 1%; border-radius:25px; background-color: #ffffff;">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">번호</th>
                        <th scope="col">부서</th>
                        <th scope="col">이름</th>
                        <th scope="col">월</th>
                        <th scope="col">화</th>
                        <th scope="col">수</th>
                        <th scope="col">목</th>
                        <th scope="col">금</th>
                        <th scope="col">기능</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in workingTimes">
                        <td scope="row" v-html="num(index)"></td>
                        <td v-html="item.group_name"></td>
                        <td v-html="item.member_name"></td>
                        <td v-html="workingTime(item.working_time_start_time_1, item.working_time_end_time_1)"></td>
                        <td v-html="workingTime(item.working_time_start_time_2, item.working_time_end_time_2)"></td>
                        <td v-html="workingTime(item.working_time_start_time_3, item.working_time_end_time_3)"></td>
                        <td v-html="workingTime(item.working_time_start_time_4, item.working_time_end_time_4)"></td>
                        <td v-html="workingTime(item.working_time_start_time_5, item.working_time_end_time_5)"></td>
                        <td>
                            <button type="button" class="btn btn-outline-danger btn-sm" @click="remove(item.working_time_id)">삭제</button>
                            &nbsp;&nbsp;&nbsp;&nbsp;
                            <button type="button" class="btn btn-outline-primary btn-sm" @click="showWorkingTimeChange(item)">수정</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

{% include "./layer/working_time_change_admin_layer.html" %}

<script src="{% static '/js/tree.min.js' %}"></script>
<script>
    const vue = createApp({
        data () {
            return {
                workingTimes: [],
                workingTimeStartTime1: "09:00",
                workingTimeEndTime1: "18:00",
                workingTimeStartTime2: "09:00",
                workingTimeEndTime2: "18:00",
                workingTimeStartTime3: "09:00",
                workingTimeEndTime3: "18:00",
                workingTimeStartTime4: "09:00",
                workingTimeEndTime4: "18:00",
                workingTimeStartTime5: "09:00",
                workingTimeEndTime5: "18:00",
                memberIds: [],
            }
        },
        methods: {
            getWorkingTimes(){
                axios.get("/re-working-admin/getWorkingTimes")
                .then((response) => {
                    this.workingTimes = response.data
                    this.getMemberTree()
                })
            },
            getMemberTree() {
                $('.treeDiv').html('');

                axios.get("/re-working-admin/getWorkingTimeGroupTree")
                .then((response) => {
                    let data = response.data
                    tree = new Tree('.treeDiv', {
                        data: [ data ],
                        closeDepth: 10,
                        loaded: function () {
                        },
                        onChange: function () {
                            vue.memberIds = []
                            for (value of this.values) {
                                vue.memberIds.push(value.split("_")[1])
                            }
                        }
                    })
                })
            },
            num(index) {
                return index + 1
            },
            workingTime(start, end) {
                return start + " ~ " + end
            },
            showWorkingTimeChange(workingTime) {
                $("#working_time_change_admin_modal").modal('show')
                working_time_change_admin_vue.getWorkingTime(workingTime)
            },
            save() {
                var data = {
                    member_ids : this.memberIds,
                    working_time_start_time_1 : this.workingTimeStartTime1,
                    working_time_end_time_1 : this.workingTimeEndTime1,
                    working_time_start_time_2 : this.workingTimeStartTime2,
                    working_time_end_time_2 : this.workingTimeEndTime2,
                    working_time_start_time_3 : this.workingTimeStartTime3,
                    working_time_end_time_3 : this.workingTimeEndTime3,
                    working_time_start_time_4 : this.workingTimeStartTime4,
                    working_time_end_time_4 : this.workingTimeEndTime4,
                    working_time_start_time_5 : this.workingTimeStartTime5,
                    working_time_end_time_5 : this.workingTimeEndTime5,
                }
                axios.post("/re-working-admin/createWorkingTime", {data: data})
                .then((response) => {
                    this.getWorkingTimes()
                })
            },
            remove(workingTimeId) {
                axios.post("/re-working-admin/deleteWorkingTime/" + workingTimeId)
                .then((response) => {
                    this.getWorkingTimes()
                })
            },
        },
        mounted: function() {
            this.getWorkingTimes()
        }
    }).mount('#working_time_change_admin')
</script>
{% endblock content %}
