{% extends 'base.html' %}
{% load static %}
{% block content %}
{% include 'home/navbar/re_navbar.html' %}

<div id="working_weekend_stat_admin" class="row" style="padding: 1%; background-color: #f9f9f9;">
    <div class="col-md-18" style="position: relative;">
        <div style="flex: auto; margin: 3vh auto; width: 97vw; min-height: 53vh; padding: 2%; border-radius:25px; background-color: #ffffff">

            <div class="row" style="padding-bottom: 1vh;">
                <div class="col-8" style="display: flex">
                    <input type="date" class="form-control" style="width: 200px" v-model="startDate">
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="date" class="form-control" style="width: 200px" v-model="endDate">
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <button type="button" class="btn btn-outline-danger" @click="getWorkingWeekendStats">검색</button>
                </div>
                <div class="col-4" style="text-align:end">
                    <button type="button" class="btn btn-outline-success" @click="download">다운로드</button>
                </div>
            </div>

            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">이름</th>
                        <th scope="col">부서명</th>
                        <th scope="col">휴일 근무일</th>
                        <th scope="col">휴일 근무 시간</th>
                        <th scope="col">휴일 휴게 시간</th>
                        <th scope="col">휴일 총 근무 시간</th>
                        <th scope="col">기능</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in workingWeekendStats">
                        <td v-html="item.member_name"></td>
                        <td v-html="item.group_name"></td>
                        <td v-html="item.working_weekend_date"></td>
                        <td v-html="item.working_weekend_datetime"></td>
                        <td v-html="item.working_weekend_free_time"></td>
                        <td v-html="item.total_working_weekend_datetime"></td>
                        <td>
                            <button type="button" class="btn btn-outline-success btn-sm" @click="showWorkingWeekendStatsDaily(item.member_id)">상세</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

{% include "./layer/working_weekend_stat_admin_layer.html" %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
<script>
    const vue = createApp({
        data () {
            return {
                startDate: "",
                endDate: "",
                workingWeekendStats: [],
            }
        },
        methods: {
            getWorkingWeekendStats() {
                axios.get("/re-working-admin/getWorkingWeekendStats?startDate=" + this.startDate + "&endDate=" + this.endDate)
                .then((response) => {
                    this.workingWeekendStats = response.data
                })
            },
            showWorkingWeekendStatsDaily(memberId) {
                $("#working_weekend_stat_admin_modal").modal('show')
                working_weekend_stat_admin_vue.getWorkingWeekendStatsDaily(memberId, this.startDate, this.endDate)
            },
            download() {
                var data = [
                    [ "이름", "부서", "휴일근무일", "휴일근무시간", "휴일휴게시간", "휴일총근무시간" ]
                ]

                for (workingWeekendStat of this.workingWeekendStats) {
                    data.push(
                        [
                            workingWeekendStat.member_name
                            ,workingWeekendStat.group_name
                            ,workingWeekendStat.working_weekend_date
                            ,workingWeekendStat.working_weekend_datetime
                            ,workingWeekendStat.working_weekend_free_time
                            ,workingWeekendStat.total_working_weekend_datetime
                        ]
                    )
                }

                var ws = XLSX.utils.aoa_to_sheet(data)
                var wb = XLSX.utils.book_new()

                XLSX.utils.book_append_sheet(wb, ws, this.startDate + "~" + this.endDate)
                XLSX.writeFile(wb, '휴일근무통계_' + moment().format('YYYY-MM-DD') + '.xlsx')
            },
        },
        mounted: function() {
            this.startDate = moment().startOf('month').format('YYYY-MM-DD')
            this.endDate = moment().endOf('month').format('YYYY-MM-DD')

            this.getWorkingWeekendStats()
        },
    }).mount('#working_weekend_stat_admin')
</script>
{% endblock content %}
