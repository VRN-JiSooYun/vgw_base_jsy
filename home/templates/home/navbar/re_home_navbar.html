      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a type="button"  class="btn {% if '' == urlPath.2 or 'working-month-view' == urlPath.2 %}btn-warning {% else %}btn-dark{% endif %} btn-sm" href="{% url 're-working-month-home' %}">나의 캘린더</a>
        </li>
        <li class="nav-item active">
          <a type="button"  class="btn {% if 'working-share-month-view' == urlPath.2 or 'working-share-week-view' == urlPath.2 %}btn-warning {% else %}btn-dark{% endif %} btn-sm" href="{% url 're-working-share-month-home' %}">그룹 캘린더</a>
        </li>
        <li class="nav-item active">
          <a type="button"  class="btn {% if 'working-off-view' == urlPath.2 %}btn-warning {% else %}btn-dark{% endif %} btn-sm" href="{% url 're-working-off-home' %}">휴가 관리</a>
        </li>
        <li class="nav-item active">
          <a type="button"  class="btn {% if 'working-weekend-view' == urlPath.2 %}btn-warning {% else %}btn-dark{% endif %} btn-sm" href="{% url 're-working-weekend-home' %}">휴일근무 관리</a>
        </li>
        <li class="nav-item active">
          <a type="button"  class="btn {% if 'working-approval-view' == urlPath.2 %}btn-warning {% else %}btn-dark{% endif %} btn-sm" href="{% url 're-working-approval-home' %}">휴가·휴일 결재함 &nbsp;<span class="badge badge-danger" v-show="exsitNewCount > 0">[[ exsitNewCount ]]</span></a>

      </ul>
    </div>

<script>
  const approval_count_vue = createApp({
      delimiters: ["[[", "]]"],
      data () {
          return {
            exsitNewCount: 0
          }
      },
      methods: {
        getCount() {
          axios.get("/re-working/getApprovalRequestCount")
          .then((response) => {
            this.exsitNewCount = response.data
          })
        },
      },
      mounted: function() {
        this.getCount()
      }
  }).mount('#site-header')
</script>
