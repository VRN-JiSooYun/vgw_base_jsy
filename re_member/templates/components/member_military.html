{% load getCode %}
{% load getCodeDtls %}
<template id="member-military">
    <div class="info-box">
        <form class="row g-3">
            <div class="col-6">
                <label for="military_discharge_type" class="form-label">제대구분</label>
                <select class="form-select" v-model="item.military_discharge_type">
                    {% with codes|getCdNo:"MILITARY_DISCHARGE_TYPE" as cdNo %}
                    {% for codeDtl in codeDtls|getCodeDtls:cdNo %}
                    <option value="{{ codeDtl.cd_dtl_no }}">{{ codeDtl.cd_dtl_desc }}</option>
                    {% endfor %}
                    {% endwith %}
                </select>
            </div>
            <div class="col-6">
                <label for="military_etc_type" class="form-label">특례구분</label>
                <select class="form-select" v-model="item.military_etc_type">
                    <option value="">없음</option>
                    {% with codes|getCdNo:"MILITARY_ETC_TYPE" as cdNo %}
                    {% for codeDtl in codeDtls|getCodeDtls:cdNo %}
                    <option value="{{ codeDtl.cd_dtl_no }}">{{ codeDtl.cd_dtl_desc }}</option>
                    {% endfor %}
                    {% endwith %}
                </select>
            </div>
            <div class="col-4">
                <label for="military_type" class="form-label">군별</label>
                <select class="form-select" v-model="item.military_type">
                    {% with codes|getCdNo:"MILITARY_TYPE" as cdNo %}
                    {% for codeDtl in codeDtls|getCodeDtls:cdNo %}
                    <option value="{{ codeDtl.cd_dtl_no }}">{{ codeDtl.cd_dtl_desc }}</option>
                    {% endfor %}
                    {% endwith %}
                </select>
            </div>
            <div class="col-4">
                <label for="military_discharge_rank" class="form-label">최종계급</label>
                <select class="form-select" v-model="item.military_discharge_rank">
                    {% with codes|getCdNo:"MILITARY_DISCHARGE_RANK" as cdNo %}
                    {% for codeDtl in codeDtls|getCodeDtls:cdNo %}
                    <option value="{{ codeDtl.cd_dtl_no }}">{{ codeDtl.cd_dtl_desc }}</option>
                    {% endfor %}
                    {% endwith %}
                </select>
            </div>
            <div class="col-4">
                <label for="military_skill" class="form-label">병과</label>
                <input type="text" class="form-control" v-model="item.military_skill">
            </div>
            <div class="col-4">
                <label for="military_start_date" class="form-label">복무 시작일</label>
                <input type="date" class="form-control" v-model="item.military_start_date" placeholder="YYYY-MM-DD">
            </div>
            <div class="col-4">
                <label for="military_end_date" class="form-label">복무 종료일</label>
                <input type="date" class="form-control" v-model="item.military_end_date" placeholder="YYYY-MM-DD">
            </div>
            <div class="col-4">
                <label for="military_num" class="form-label">군번</label>
                <input type="text" class="form-control" v-model="item.military_num">
            </div>
            <div class="col-12">
                <label for="military_memo" class="form-label">미필사유</label>
                <input type="text" class="form-control" v-model="item.military_memo">
            </div>
        </form>
    </div>
</template>

<script>
    const memberMilitaryComponent = {
        props: {
            item: {
                type: Object,
            },
        },
        methods: {},
        mounted: function() {},
        template:'#member-military',
    }
</script>
