<div class="tab-pane fade" id="working_weekend_note" role="tabpanel" aria-labelledby="working-weekend-note-tab" tabindex="1">
    <div style="flex: auto; margin: 3vh auto; width: 97vw; min-height: 53vh; padding: 2%; border-radius:25px; background-color: #ffffff">
        <div style="width: 100%; text-align:right; margin-bottom: 1vh;">
            <button type="button" class="btn btn-outline-primary" @click="showWorkingWeekendNote()">휴일근무일지 신청</button>
        </div>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">번호</th>
                    <th scope="col">결재번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">휴일근무일</th>
                    <th scope="col">결재 상태</th>
                    <th scope="col">결재일시</th>
                    <th scope="col">결재자</th>
                    <th scope="col">기능</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(item, index) in workingWeekendNoteForms">
                    <td scope="row" v-html="num(index)"></td>
                    <td v-html="item.approval_id"></td>
                    <td v-html="item.working_weekend_note_form_title"></td>
                    <td v-html="item.working_weekend_date"></td>
                    <td v-html="cdDtlNm(item.approval_state)"></td>
                    <td v-html="datetime(item.approval_date)"></td>
                    <td v-html="item.member_name"></td>
                    <td>
                        <button type="button" class="btn btn-outline-success btn-sm" @click="showWorkingWeekendNoteView(item.working_weekend_note_form_id)">상세보기</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

{% include "./layer/working_weekend_note_layer.html" %}
{% include "./layer/working_weekend_note_view_layer.html" %}

<script>
    var working_weekend_note_vue = createApp({
        data () {
            return {
                workingWeekendNoteForms: [],
            }
        },
        methods: {
            getWorkingWeekendNoteForms() {
                axios.get("/re-working/getWorkingWeekendNoteForms")
                .then((response) => {
                    let data = response.data
                    this.workingWeekendNoteForms = data.workingWeekendNoteForms
                })
            },
            num(index) {
                return index + 1
            },
            datetime(datetime) {
                return moment(datetime).format('YYYY-MM-DD HH:mm:ss')
            },
            date(startDate, endDate) {
                return startDate + " ~ " + endDate
            },
            cdDtlNm(cdDtlNo) {
                return code_vue.getCodeDtl(cdDtlNo).cd_dtl_nm
            },
            cdDtlNo(alias) {
                return code_vue.getCdDtlNoByAlias(alias)
            },
            showWorkingWeekendNote() {
                $("#working_weekend_note_modal").modal('show')
            },
            showWorkingWeekendNoteView(workingWeekendNoteFormId) {
                $("#working_weekend_note_view_modal").modal('show')
                working_weekend_note_view_vue.getWorkingWeekendNoteView(workingWeekendNoteFormId)
            }
        },
        mounted: function() {
            this.getWorkingWeekendNoteForms()

            var self = this
            $("#working-weekend-note-tab").on('shown.bs.tab', function (event) {
                self.getWorkingWeekendNoteForms()
            })
        }
    }).mount('#working_weekend_note')
</script>
