{% load static %}

<div id="working_time_modal" class="modal fade" data-backdrop="static" data-keyboard="true" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" v-html="title"></h5>
            </div>
            <div class="modal-body">
                <div class="row" style="border-top: 0.5px solid #e2e4e7; border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">출근 시간</div>
                    <div class="col-4" style="padding: 15px;" v-html="time(workingStartCheckTime)"></div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">퇴근 시간</div>
                    <div class="col-4" style="padding: 15px;" v-html="time(workingEndCheckTime)"></div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">출근 시간</div>
                    <div class="col-4" style="padding: 15px;">
                        <input  type="time" class="form-control" v-model="workingStartChangeTime">
                    </div>
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">퇴근 시간</div>
                    <div class="col-4" style="padding: 15px;">
                        <input  type="time" class="form-control" v-model="workingEndChangeTime">
                    </div>
                </div>
                <div class="row" style="border-bottom: 0.5px solid #e2e4e7">
                    <div class="col-2" style="padding: 15px; background: #f7f6f9;">사유</div>
                    <div class="col" style="padding: 15px;">
                        <textarea class="form-control" rows="4" cols="70" v-model="workingTimeChangeReason"></textarea>
                        <div class="position-fixed top-0 end-0 translate-middle-x" style="z-index: 11">
                            <div id="myToast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
                                <div class="toast-body"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div v-if="isShowMessage" style="color:red; padding: 10px"># 누락 사유가 '휴가' 또는 '외근' 이신 경우는, '취소'버튼 입력 후 '휴가' 또는 '외근' 신청 바랍니다.</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="close">취소</button>
                <button type="button" class="btn btn-primary" @click="save">등록</button>
            </div>
        </div>
    </div>
</div>

<script>
    const working_time_vue = createApp({
        data () {
            return {
                title: "",
                workingDate: "",
                working: {},
                workingStartCheckTime: "",
                workingEndCheckTime: "",
                workingStartChangeTime: "",
                workingEndChangeTime: "",
                workingTimeChangeReason: "사용자 등록 누락",
                isShowMessage: false,
            }
        },
        methods: {
            time(datetime) {
                if (datetime == '' || datetime == null) return "누락"
                return moment(datetime).format("HH:mm")
            },
            getWorking(workingDate) {
                this.workingDate = workingDate
                axios.get("/re-working/getWorking/" + workingDate)
                .then((response) => {
                    this.working = response.data[0]
                    this.title = "출퇴근 변경 (" + workingDate + ")"
                    if (typeof this.working == 'undefined') {
                        this.isShowMessage = true
                        return;
                    }

                    this.workingStartCheckTime = this.working.working_start_check_datetime
                    this.workingEndCheckTime = this.working.working_end_check_datetime

                    if (this.workingStartCheckTime == null && this.workingEndCheckTime == null) {
                        this.isShowMessage = true
                    }

                    if (this.workingStartCheckTime != null) {
                        this.workingStartChangeTime = moment(this.workingStartCheckTime).format("HH:mm")
                    }

                    if (this.workingEndCheckTime != null) {
                        this.workingEndChangeTime = moment(this.workingEndCheckTime).format("HH:mm")
                    }
                })
            },
            save() {
                if (this.workingTimeChangeReason == "") {
                    this.toast("사유를 입력해 주세요.")
                    return
                }

                if (this.workingStartChangeTime == "" && this.workingEndChangeTime == "") {
                    this.toast("출퇴근 변경 시간을 입력해 주세요.")
                    return
                }

                if (this.workingEndChangeTime != '' && this.workingEndChangeTime != moment(this.workingEndCheckTime).format("HH:mm")) {
                    if (this.workingStartChangeTime > this.workingEndChangeTime) {
                        this.toast("퇴근 시간을 확인해 주세요.")
                        return
                    }
                }

                var workingStartChangeTime = ""
                if (this.workingStartChangeTime != '' && this.workingStartChangeTime != moment(this.workingStartCheckTime).format("HH:mm")) {
                    workingStartChangeTime = moment(this.workingDate).format("YYYY-MM-DD") + " " + this.workingStartChangeTime
                }

                var workingEndChangeTime = ""
                if (this.workingEndChangeTime != '' && this.workingEndChangeTime != moment(this.workingEndCheckTime).format("HH:mm")) {
                    workingEndChangeTime = moment(this.workingDate).format("YYYY-MM-DD") + " " + this.workingEndChangeTime
                }

                var data = {
                    working_date: this.workingDate,
                    working_start_change_datetime: workingStartChangeTime,
                    working_end_change_datetime: workingEndChangeTime,
                    working_time_change_reason: this.workingTimeChangeReason,
                }

                axios.post("/re-working/changeWorkingTime", {data: data})
                .then((response) => {
                    vue.getWorkingMonthData()
                    this.close()
                })
            },
            close() {
                $("#working_time_modal").modal('hide')
                this.workingDate = ""
                this.workingStartCheckTime = ""
                this.workingEndCheckTime = ""
                this.workingStartChangeTime = ""
                this.workingEndChangeTime = ""
                this.workingTimeChangeReason = "사용자 등록 누락"
            },
            toast(text) {
                $(".toast-body").html(text)
                $("#myToast").toast({animation: false, delay: 1500});
                $("#myToast").toast('show');
            }
        },
        mounted: function() {
            var self = this
            $('#working_time_modal').on('hidden.bs.modal', function (e) {
                self.close()
            })
        },
    }).mount('#working_time_modal')
</script>
