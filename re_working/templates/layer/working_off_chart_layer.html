{% load static %}

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/series-label.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/export-data.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>

<style>
	.highcharts-figure,

	.highcharts-data-table table {
		min-width: 1000px;
		max-width: 1200px;
		margin: 1em auto;
	}
	.highcharts-data-table table {
		font-family: Verdana, sans-serif;
		border-collapse: collapse;
		border: 1px solid #ebebeb;
		margin: 10px auto;
		text-align: center;
		width: 100%;
		max-width: 500px;
	}

	.highcharts-data-table caption {
		padding: 1em 0;
		font-size: 1.2em;
		color: #555;
	}

	.highcharts-data-table th {
		font-weight: 600;
		padding: 0.5em;
	}

	.highcharts-data-table td,
	.highcharts-data-table th,
	.highcharts-data-table caption {
		padding: 0.5em;
	}

	.highcharts-data-table thead tr,
	.highcharts-data-table tr:nth-child(even) {
		background: #f8f8f8;
	}

	.highcharts-data-table tr:hover {
		background: #f1f7ff;
	}


	.modal-content {
		max-width:none;
	}
</style>


<div id="working_off_chart_modal" class="modal fade" data-backdrop="static" data-keyboard="true" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-body">
                <figure class="highcharts-figure">
                    <div id="container"></div>
                </figure>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="close">취소</button>
            </div>
        </div>
    </div>
</div>

<script>
    const working_off_chart_vue = createApp({
        data () {
            return {
                month: 0
            }
        },
        methods: {
            getChartData(workingDate) {
                this.month = workingDate.month() + 1
                var startDate = workingDate.startOf('month').format("YYYY-MM-DD")
                var endDate = workingDate.endOf('month').format("YYYY-MM-DD")
                axios.get('/re-working/getChartData?startDate=' + startDate + "&endDate=" + endDate)
				.then((response) => {
                    this.drawChart(response.data)
                })
            },
            drawChart(chartData) {
                // $("#chart_loading").hide();
                var cData = [];
                for(var data of chartData){
                    cData.push({
                        name: data['name'],
                        data: data.data,
                    })
                }

                Highcharts.chart('container', {
                    loading: {
                        hideDuration: 100
                    },
                    title: {
                        text: this.month + "월 출퇴근 시간",
                        align: 'center'
                    },
                    yAxis: {
                        title: {
                            text: '시간'
                        }
                    },
                    xAxis: {
                        title: {
                            text: '일'
                        },
                        accessibility: {
                            rangeDescription: 'Range: 1 to 31'
                        }
                    },
                    legend: {
                        layout: 'vertical',
                        align: 'right',
                        verticalAlign: 'middle'
                    },
                    plotOptions: {
                        series: {
                            label: {
                                connectorAllowed: false
                            },
                            pointStart: 1
                        }
                    },
                    series: cData,
                    responsive: {
                        rules: [{
                            condition: {
                                maxWidth: 500
                            },
                            chartOptions: {
                                legend: {
                                    layout: 'horizontal',
                                    align: 'center',
                                    verticalAlign: 'bottom'
                                }
                            }
                        }]
                    }
                })
            },
            close() {
                $("#working_off_chart_modal").modal('hide')
            },
        },
        mounted: function() {
            var self = this
            $('#working_off_chart_modal').on('hidden.bs.modal', function (e) {
                self.close()
            })
        }
    }).mount('#working_off_chart_modal')

</script>
