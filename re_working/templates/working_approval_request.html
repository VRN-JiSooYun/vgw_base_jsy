<div class="tab-pane fade show active" id="approval_request" role="tabpanel" aria-labelledby="approval-request-tab" tabindex="0">
    <div style="flex: auto; margin: 3vh auto; width: 97vw; min-height: 53vh; padding: 2%; border-radius:25px; background-color: #ffffff">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">번호</th>
                    <th scope="col">결재번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">휴가/휴일/일지</th>
                    <th scope="col">작성자</th>
                    <th scope="col">결재일시</th>
                    <th scope="col">기능</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(item, index) in workingApprovals">
                    <td scope="row" v-html="num(index)"></td>
                    <td v-html="item.approval_id"></td>
                    <td v-html="item.form_title"></td>
                    <td v-html="formType(item.form_type, item.working_type)"></td>
                    <td v-html="item.member_name"></td>
                    <td v-html="datetime(item.approval_date)"></td>
                    <td>
                        <button type="button" class="btn btn-outline-primary btn-sm" @click="showWorkingApproval(item.form_id, item.approval_id, item.form_type)">결재</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const vue = createApp({
        data () {
            return {
                workingApprovals: [],
            }
        },
        methods: {
            getApprovals() {
                axios.get("/re-working/getWorkingApprovalRequest")
                .then((response) => {
                    let data = response.data
                    this.workingApprovals = data.workingApprovalRequest
                })
            },
            num(index) {
                return index + 1
            },
            datetime(datetime) {
                return moment(datetime).format('YYYY-MM-DD HH:mm:ss')
            },
            date(startDate, endDate) {
                return startDate + " ~ " + endDate
            },
            formType(formType, workingType) {
                var result = ""
                if (formType == "working_off") {
                    result = "휴가-" + this.cdDtlNm(workingType)
                } else if (formType == "working_weekend") {
                    result = "휴일신청"
                } else if (formType == "working_weekend_note") {
                    result = "휴일일지"
                }
                return result
            },
            cdDtlNm(cdDtlNo) {
                return code_vue.getCodeDtl(cdDtlNo).cd_dtl_nm
            },
            cdDtlNo(alias) {
                return code_vue.getCdDtlNoByAlias(alias)
            },
            showWorkingApproval(formId, approvalId, form_type) {
                $("#working_approval_modal").modal('show')
                working_approval_vue.getWorkingApproval(formId, approvalId, form_type, false)
            },
        },
        mounted: function() {
            this.getApprovals()

            var self = this
            $("#approval-request-tab").on('shown.bs.tab', function (event) {
                self.getApprovals()
            })

        }
    }).mount('#approval_request')
</script>
