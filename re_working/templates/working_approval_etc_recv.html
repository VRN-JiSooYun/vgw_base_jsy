<div class="tab-pane fade" id="approval_etc_recv" role="tabpanel" aria-labelledby="approval-etc-recv-tab" tabindex="3">
    <div style="flex: auto; margin: 3vh auto; width: 97vw; min-height: 53vh; padding: 2%; border-radius:25px; background-color: #ffffff">

        <div class="row" style="padding-bottom: 1vh;">
            <div class="col-8" style="display: flex">
                <input type="text" class="form-control" style="width: 12vw" v-model="searchStr" placeholder="제목 또는 작성자 검색">
                &nbsp;&nbsp;&nbsp;&nbsp;
                <button type="button" class="btn btn-outline-danger" @click="search">검색</button>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">번호</th>
                    <th scope="col">결재번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">휴가/휴일/일지</th>
                    <th scope="col">작성자</th>
                    <th scope="col">결재 상태</th>
                    <th scope="col">결재일시</th>
                    <th scope="col">기능</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(item, index) in workingApprovalEtcRecvs">
                    <td scope="row" v-html="num(index)"></td>
                    <td v-html="item.approval_id"></td>
                    <td v-html="item.form_title"></td>
                    <td v-html="formType(item.form_type, item.working_type)"></td>
                    <td v-html="item.member_name"></td>
                    <td v-html="cdDtlNm(item.approval_state)"></td>
                    <td v-html="datetime(item.approval_date)"></td>
                    <td>
                        <button type="button" class="btn btn-outline-success btn-sm" @click="showWorkingApproval(item.form_id, item.approval_id, item.form_type)">상세보기</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    createApp({
        data () {
            return {
                oriWorkingApprovalEtcRecvs: [],
                workingApprovalEtcRecvs: [],
                searchStr: "",
            }
        },
        methods: {
            getApprovalEtcRecvs() {
                axios.get("/re-working/getWorkingApprovalEtcRecvs")
                .then((response) => {
                    let data = response.data
                    this.workingApprovalEtcRecvs = data.workingApprovalEtcRecvs
                    this.oriWorkingApprovalEtcRecvs = data.workingApprovalEtcRecvs
                })
            },
            num(index) {
                return index + 1
            },
            datetime(datetime) {
                return moment(datetime).format('YYYY-MM-DD HH:mm:ss')
            },
            date(startDate, endDate) {
                return startDate + " ~ " + endDate
            },
            cdDtlNm(cdDtlNo) {
                return code_vue.getCodeDtl(cdDtlNo).cd_dtl_nm
            },
            formType(formType, workingType) {
                var result = ""
                if (formType == "working_off") {
                    result = "휴가-" + this.cdDtlNm(workingType)
                } else if (formType == "working_weekend") {
                    result = "휴일신청"
                } else if (formType == "working_weekend_note") {
                    result = "휴일일지"
                }
                return result
            },
            search() {
                this.workingApprovalEtcRecvs = this.oriWorkingApprovalEtcRecvs.filter(workingApprovalEtcRecv => {
                    if (workingApprovalEtcRecv.form_title.includes(this.searchStr) || (workingApprovalEtcRecv.member_name.includes(this.searchStr))) {
                        return workingApprovalEtcRecv
                    }
                })
            },
            showWorkingApproval(formId, approvalId, form_type) {
                $("#working_approval_modal").modal('show')
                working_approval_vue.getWorkingApproval(formId, approvalId, form_type, true)
            },
        },
        mounted: function() {
            this.getApprovalEtcRecvs()
            var self = this
            $("#approval-etc-recv-tab").on('shown.bs.tab', function (event) {
                self.getApprovalEtcRecvs()
            })

        }
    }).mount('#approval_etc_recv')
</script>
