{% extends 'base.html' %}
{% block content %}
{% load static %}
{% include 'home/navbar/re_navbar.html' %}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
	.calendar ul {
        display: flex;
        list-style: none;
        flex-wrap: wrap;
        text-align: left;
        margin-top: 20px;
    }
    .calendar .weeks li {
        font-weight: 500;
    }
    .calendar .days {
        margin-bottom: 0px;
    }
    .calendar ul li {
        width: calc(100% / 7);
        position: relative;
    }
    .calendar .days li {
        z-index: 1;
    }
    .days li.inactive {
        color: #aaa;
    }
    .week {
        width: 13.3vw;
        height: 4vh;
        border-top: 0.5px solid #e2e4e7;
        border-left: 0.5px solid #e2e4e7;
        border-right: 0.5px solid #e2e4e7;
        padding: 5px;
    }
</style>

<div id="working_share_month" class="row" style="padding: 1%; background-color: #f9f9f9;">
    <div class="col-md-18" style="position: relative;">
        <div style="flex: auto; width: 97vw; min-height: 74vh; padding: 1%; border-radius:25px; background-color: #ffffff">
            <div class="row justify-content-between">
                <div class="col-4">
                    <button type="button" class="btn btn-outline-secondary" @click="goToday">오늘</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <button type="button" class="btn btn-outline-danger" @click="goPrevMonth"><</button>
                    &nbsp;
                    <button type="button" class="btn btn-outline-danger" @click="goNextMonth">></button>
                    &nbsp;&nbsp;&nbsp;
                    <div style="display:inline; width: 6vw; height: 3vh; border-width: 0; outline: none; color: orange; font-weight: bold;" v-html="working_date_display" readonly></div>
                </div>
                <div class="col-4" style="text-align:center">
                    <div>
                        <div class="input-group flex-nowrap">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="addon-wrapping">
                                    <span class="material-symbols-outlined">search</span>
                                </span>
                            </div>
                            <input type="text" class="form-control" style="background: #e9ecef" placeholder="검색" aria-describedby="addon-wrapping" v-model="search">
                        </div>
                    </div>
                </div>
                <div class="col-4" style="text-align:end">
                    <button type="button" class="btn btn-outline-secondary form-control float-right" style="width: 3vw" @click="goWeek">주</button>
                </div>
            </div>

            <div class="row" style="margin-right: 1vw;">
                <div class="calendar">
                    <ul class="days">
                        <workingmonthheader v-if="isHeaderShow"></workingmonthheader>
                        <li v-for="(item, index) in dates">
                            <workingsharemonthday :index="index" :item="item" :search="search"></workingsharemonthday>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

{% include "./components/working_month_header.html" %}
{% include "./components/working_share_month_day.html" %}

<script>
    const vue = createApp({
        components: {
            "workingmonthheader": workingMonthHeaderComponent,
            "workingsharemonthday": workingShareMonthDayComponent,
        },
        data () {
            return {
                working_date_display: "",
                working_date: "",
                month: [],
                dates: [],
                isHeaderShow: false,
                search: "",
            }
        },
        methods: {
            goToday() {
                this.working_date = moment()
                this.makeCalendar()
            },
            goPrevMonth() {
                this.working_date = moment(this.working_date).add("-1","months")
                this.makeCalendar()
            },
            goNextMonth() {
                this.working_date = moment(this.working_date).add("1","months")
                this.makeCalendar()
            },
            makeCalendar() {
                this.working_date_display = moment(this.working_date).format('YYYY년 MM월')
                var firstDate = moment(this.working_date).set('date', 1).set('day', 0)
                var lastDate = moment(this.working_date).set('date', moment(this.working_date).daysInMonth()).set('day', 6)

                var isDone = false
                this.month = []
                while(!isDone) {
                    if (lastDate.format('YYYY-MM-DD') == firstDate.format('YYYY-MM-DD')) {
                        isDone = true
                    }
                    this.month.push(firstDate.format('YYYY-MM-DD'))
                    firstDate = firstDate.add(1, 'day')
                }

                this.getWorkingShareMonthData()
            },
            getWorkingShareMonthData() {
                var startDate = this.month.at(0)
                var endDate = this.month.at(-1)

                axios.get("/re-working/getWorkingShareMonthData?start_date=" + startDate + "&end_date=" + endDate)
                .then((response) => {
                    let data = response.data
                    var workings = data.workings
                    var holidays = data.holidays

                    let workingMap = workings.reduce((map, working) => {
                        if (typeof map[working.working_date] != 'undefined') {
                            map[working.working_date].push(working)
                        } else {
                            map[working.working_date] = [working]
                        }
                        return map
                    }, {})


                    let holidayMap = holidays.reduce((map, holiday) => {
                        map[holiday.holiday_date] = holiday
                        return map
                    }, {})

                    this.dates = []
                    for (var inx = 0; inx < this.month.length; inx++) {
                        let date = this.month[inx]

                        this.dates.push({
                            date: date,
                            workings: typeof workingMap[date] == 'undefined' ? [] : workingMap[date],
                            holiday: holidayMap[date],
                        })
                    }

                    this.isHeaderShow = true
                })
            },
            goWeek() {
                document.location.href='/re-working/working-share-week-view'
            },
        },
        mounted: function() {
            this.working_date = moment()
            this.makeCalendar()
        }
    }).mount('#working_share_month')
</script>

{% endblock content %}
